name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install ".[dev]"

      - name: Verify installed dependency set
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Check package lint
        run: python -m ruff check --config pyproject.toml open_binancian_futures

      - name: Check package types
        run: python -m mypy --config-file pyproject.toml open_binancian_futures
